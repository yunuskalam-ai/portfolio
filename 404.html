<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Yunus Kalam</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="theme-color" content="#f3f0e8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    document.documentElement.classList.add('js');
    try {
      var saved = localStorage.getItem('theme');
      var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = saved || preferred;
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main class="error-page" id="main">
    <p class="eyebrow">Error / 404</p>
    <h1>This signal<br><em>dropped.</em></h1>
    <p>The page you’re looking for has moved or never existed.</p>
    <a class="button button-primary" href="index.html">Return home <span aria-hidden="true">↘</span></a>
  </main>
</body>
</html>
