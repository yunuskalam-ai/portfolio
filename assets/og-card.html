<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG Card</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; }
    body {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 82% 18%, rgba(255, 90, 54, .18), transparent 22rem),
        linear-gradient(rgba(22, 22, 20, .08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22, 22, 20, .08) 1px, transparent 1px),
        #f3f0e8;
      background-size: auto, 64px 64px, 64px 64px, auto;
      color: #161614;
      font-family: "Aptos", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }
    .frame {
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(22, 22, 20, .28);
    }
    .rail {
      position: absolute;
      top: 28px;
      bottom: 28px;
      left: 28px;
      width: 76px;
      border-right: 1px solid rgba(22, 22, 20, .2);
    }
    .mark {
      position: absolute;
      top: 34px;
      left: 50%;
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(22, 22, 20, .45);
      border-radius: 50%;
      font-family: Georgia, serif;
      font-size: 15px;
      transform: translateX(-50%);
    }
    .content {
      position: absolute;
      top: 28px;
      right: 28px;
      bottom: 28px;
      left: 104px;
      padding: 52px 58px;
    }
    .eyebrow {
      margin: 0 0 22px;
      color: #6d685e;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 112px;
      font-weight: 400;
      letter-spacing: -.07em;
      line-height: .82;
    }
    h1 em { color: #ff5a36; font-weight: 400; }
    .sub {
      margin: 26px 0 0;
      color: #6d685e;
      font-size: 22px;
      line-height: 1.5;
    }
    .project {
      position: absolute;
      right: 58px;
      bottom: 58px;
      width: 390px;
      padding: 22px;
      border: 1px solid rgba(22, 22, 20, .3);
      background: #faf8f2;
      box-shadow: 0 30px 80px rgba(30, 25, 15, .14);
    }
    .project-top {
      display: flex;
      justify-content: space-between;
      color: #6d685e;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .project h2 {
      margin: 18px 0 8px;
      font-family: Georgia, serif;
      font-size: 42px;
      font-weight: 400;
      letter-spacing: -.05em;
      line-height: .95;
    }
    .project p {
      margin: 0;
      color: #6d685e;
      font-size: 14px;
      line-height: 1.55;
    }
    .project-line {
      height: 1px;
      margin: 18px 0 14px;
      background: rgba(22, 22, 20, .18);
    }
    .project-foot {
      display: flex;
      justify-content: space-between;
      color: #6d685e;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 9px;
      border-radius: 50%;
      background: #ff5a36;
      vertical-align: 1px;
    }
    .footer {
      position: absolute;
      right: 58px;
      bottom: 34px;
      color: #6d685e;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="frame"></div>
  <div class="rail"><span class="mark">YK</span></div>
  <div class="content">
    <p class="eyebrow"><span class="dot"></span>AI &amp; Full-Stack Engineer</p>
    <h1>Yunus<br><em>Kalam.</em></h1>
    <p class="sub">AI systems. Human interfaces. Real outcomes.</p>
    <div class="project">
      <div class="project-top"><span>Featured / 01</span><span>2026</span></div>
      <h2>Ask Onboarding</h2>
      <p>A local-first RAG assistant with exact citations, honest refusals, and a help-desk fallback.</p>
      <div class="project-line"></div>
      <div class="project-foot"><span>Python · React</span><span>View case study ↗</span></div>
    </div>
    <div class="footer">yunuskalam-ai.github.io/portfolio</div>
  </div>
</body>
</html>
